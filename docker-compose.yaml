services:
  db:
    image: postgres:16
    container_name: tfg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tfg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tfg_postgres_data:/var/lib/postgresql/data

volumes:
  tfg_postgres_data: